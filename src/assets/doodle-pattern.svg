<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <g fill="none" stroke="#2f7ffb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Pencil -->
    <g transform="translate(30,45) rotate(-18)">
      <rect x="0" y="0" width="72" height="15" rx="3"/>
      <polygon points="72,0 94,7.5 72,15"/>
      <line x1="60" y1="0" x2="60" y2="15"/>
    </g>

    <!-- Formula -->
    <text x="205" y="70" font-family="Georgia, serif" font-style="italic" font-size="26" stroke="none" fill="#2f7ffb">x²+y²</text>

    <!-- Ruler -->
    <g transform="translate(345,25) rotate(12)">
      <rect x="0" y="0" width="95" height="20" rx="2"/>
      <line x1="16" y1="0" x2="16" y2="9"/>
      <line x1="32" y1="0" x2="32" y2="9"/>
      <line x1="48" y1="0" x2="48" y2="9"/>
      <line x1="64" y1="0" x2="64" y2="9"/>
      <line x1="80" y1="0" x2="80" y2="9"/>
    </g>

    <!-- Paperclip -->
    <g transform="translate(55,195) rotate(25)">
      <path d="M0,0 L0,42 C0,55 20,55 20,42 L20,10 C20,2 10,2 10,10 L10,38"/>
    </g>

    <!-- Open book -->
    <g transform="translate(195,200)">
      <path d="M0,12 C22,0 44,0 50,12 L50,55 C44,45 22,45 0,55 Z"/>
      <path d="M100,12 C78,0 56,0 50,12 L50,55 C56,45 78,45 100,55 Z"/>
    </g>

    <!-- Backpack -->
    <g transform="translate(355,185)">
      <rect x="0" y="18" width="62" height="72" rx="15"/>
      <rect x="13" y="0" width="36" height="26" rx="10"/>
      <rect x="15" y="42" width="32" height="22" rx="4"/>
    </g>

    <!-- Apple -->
    <g transform="translate(35,355)">
      <path d="M22,17 C6,17 0,33 0,46 C0,63 13,76 22,76 C31,76 44,63 44,46 C44,33 38,17 22,17 Z"/>
      <line x1="22" y1="17" x2="22" y2="4"/>
      <path d="M22,9 C28,2 36,4 34,11"/>
    </g>

    <!-- Graduation cap -->
    <g transform="translate(178,350)">
      <polygon points="44,0 88,19 44,38 0,19"/>
      <line x1="75" y1="24" x2="75" y2="48"/>
      <circle cx="75" cy="52" r="4.5"/>
      <path d="M16,24 L16,42 C16,51 72,51 72,42" fill="none"/>
    </g>

    <!-- Star -->
    <g transform="translate(390,345)">
      <polygon points="16,0 20.5,11 32,11 22.5,18.5 26,30 16,23 6,30 9.5,18.5 0,11 11.5,11"/>
    </g>

    <!-- Small formula -->
    <text x="270" y="175" font-family="Georgia, serif" font-style="italic" font-size="20" stroke="none" fill="#2f7ffb">4×5</text>

  </g>
</svg>
